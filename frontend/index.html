<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111318" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <link rel="icon" id="app-favicon" type="image/png" href="/favicon-light.png" />
    <title>AAT · Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap"
      rel="stylesheet"
    />
    <script>
      (() => {
        const saved = localStorage.getItem("journal-theme");
        const theme = saved === "dark" || saved === "light"
          ? saved
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.getElementById("app-favicon").href = theme === "dark" ? "/favicon-dark.png" : "/favicon-light.png";
      })();
    </script>
  </head>
  <body>
    <!-- 1. The container where React will inject your app -->
    <div id="root"></div>

    <!-- 2. Link to your main TypeScript entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
